<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkRP Job Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #2a2a32;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: #00a8ff; margin-top: 0; }
        .main-layout { display: flex; gap: 25px; flex-wrap: wrap; }
        .form-section { flex: 1; min-width: 300px; }
        .output-section { flex: 1; min-width: 300px; display: flex; flex-direction: column; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #ccc; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px;
            background: #1e1e24; color: #fff; box-sizing: border-box;
        }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        pre {
            background: #141419; padding: 15px; border-radius: 6px;
            border: 1px solid #333; overflow-x: auto; color: #a9ffb4;
            font-family: 'Courier New', Courier, monospace; flex-grow: 1; margin: 0;
        }
        button {
            background: #00a8ff; color: white; border: none; padding: 12px;
            border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;
            margin-top: 15px; font-size: 16px; transition: background 0.2s;
        }
        button:hover { background: #0088cc; }
        .copy-btn { background: #28a745; margin-top: 10px; }
        .copy-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>Генератор Профессий DarkRP 🎭</h1>
    <div class="main-layout">
        
        <!-- Панель ввода данных -->
        <div class="form-section">
            <div class="form-group">
                <label for="jobId">Уникальный ID (TEAM_переменная):</label>
                <input type="text" id="jobId" value="TEAM_CITIZEN" placeholder="Например: TEAM_POLICE">
            </div>
            
            <div class="form-group">
                <label for="name">Название профессии:</label>
                <input type="text" id="name" value="Гражданин" placeholder="Например: Полицейский">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="color">Цвет профессии (HEX):</label>
                    <input type="color" id="color" value="#00a8ff" style="width:100%; height:40px; border:none; background:none; cursor:pointer;">
                </div>
                <div class="form-group">
                    <label for="salary">Зарплата (\$):</label>
                    <input type="number" id="salary" value="100">
                </div>
            </div>

            <div class="form-group">
                <label for="model">Путь к модели (или через запятую):</label>
                <input type="text" id="model" value="models/player/group01/male_04.mdl" placeholder='models/player/police.mdl'>
            </div>

            <div class="form-group">
                <label for="description">Описание:</label>
                <textarea id="description" rows="3" placeholder="Чем занимается эта профа?">Обычный житель города.</textarea>
            </div>

            <div class="form-group">
                <label for="weapons">Оружие на спавне (через запятую):</label>
                <input type="text" id="weapons" value="weapon_fists" placeholder="weapon_pistol, weapon_fists">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="max">Макс. игроков (0 = безлимит):</label>
                    <input type="number" id="max" value="0">
                </div>
                <div class="form-group">
                    <label for="access">Доступ (Кому разрешено):</label>
                    <select id="access">
                        <option value="all">Всем игрокам</option>
                        <option value="admin">Только Админам (admin = 1)</option>
                        <option value="superadmin">Только Суперадминам (admin = 2)</option>
                        <option value="vip">Только VIP (customCheck)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label><input type="checkbox" id="vote"> Нужна голосовалка</label>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="license"> Выдать лицензию на оружие</label>
                </div>
            </div>

            <button onclick="generateJob()">Сгенерировать код</button>
        </div>

        <!-- Панель вывода готового Lua-кода -->
        <div class="output-section">
            <label>Ваш Lua-код для <b>darkrp_customthings/jobs.lua</b>:</label>
            <pre id="outputCode">-- Нажмите кнопку генерации...</pre>
            <button class="copy-btn" onclick="copyToClipboard()">Копировать в буфер</button>
        </div>

    </div>
</div>

<script>
    // Функция для перевода HEX в RGB
    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})\$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : {r: 0, g: 168, b: 255};
    }

    function generateJob() {
        const jobId = document.getElementById('jobId').value.trim().toUpperCase();
        const name = document.getElementById('name').value.trim();
        const colorHex = document.getElementById('color').value;
        const rgb = hexToRgb(colorHex);
        const salary = document.getElementById('salary').value;
        const description = document.getElementById('description').value.trim();
        const max = document.getElementById('max').value;
        const vote = document.getElementById('vote').checked ? 'true' : 'false';
        const license = document.getElementById('license').checked ? 'true' : 'false';
        const access = document.getElementById('access').value;

        // Обработка моделей (если ввели несколько через запятую)
        const rawModels = document.getElementById('model').value.split(',');
        let modelCode = '';
        if (rawModels.length > 1) {
            modelCode = '{\n        ' + rawModels.map(m => `"${m.trim()}"`).join(',\n        ') + '\n    }';
        } else {
            modelCode = `"${rawModels[0].trim()}"`;
        }

        // Обработка оружия
        const rawWeapons = document.getElementById('weapons').value.split(',');
        const weaponsCode = rawWeapons[0].trim() !== "" ? 
            '{' + rawWeapons.map(w => `"${w.trim()}"`).join(', ') + '}' : '{}';

        // Формирование команды из названия
        const command = name.toLowerCase().replace(/[^a-z0-9]/g, 'citizen_custom');

        // Логика уровней доступа
        let adminVal = '0';
        let customCheckCode = '';
        if (access === 'admin') adminVal = '1';
        if (access === 'superadmin') adminVal = '2';
        if (access === 'vip') {
            customCheckCode = `,\n    customCheck = function(ply) return ply:GetUserGroup() == "donator" or ply:IsAdmin() end,\n    CustomCheckFailMsg = "Эта профессия доступна только донатерам!"`;
        }

        // Итоговый шаблон Lua функции DarkRP
        const luaCode = `${jobId} = DarkRP.createJob("${name}", {
    color = Color(${rgb.r}, ${rgb.g}, ${rgb.b}, 255),
    model = ${modelCode},
    description = [[${description}]],
    weapons = ${weaponsCode},
    command = "${command}",
    max = ${max},
    salary = ${salary},
    admin = ${adminVal},
    vote = ${vote},
    hasLicense = ${license}${customCheckCode}
})`;

        document.getElementById('outputCode').innerText = luaCode;
    }

    function copyToClipboard() {
        const text = document.getElementById('outputCode').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('Код успешно скопирован!');
        });
    }

    // Первичная генерация при загрузке страницы
    window.onload = generateJob;
</script>

</body>
</html>
