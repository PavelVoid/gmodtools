<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkRP Custom Job Generator</title>
    <style>
        :root {
            --bg-main: #141517;
            --bg-card: #1a1c1e;
            --bg-input: #22252a;
            --border-color: #2d3139;
            --text-main: #e3e6eb;
            --text-muted: #9aa0a6;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --lua-keyword: #ff79c6;
            --lua-string: #f1fa8c;
            --lua-number: #bd93f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: #fff;
        }

        .section-group {
            background-color: rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 14px;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .full-width { grid-column: span 2; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 500;
        }

        input[type="text"], input[type="number"], select, textarea {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .color-picker-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 40px;
            height: 34px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

        .checkbox-field {
            flex-direction: row;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            margin-top: 6px;
        }

        .checkbox-field input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* Вывод кода (Терминальный стиль) */
        .sticky-output {
            position: sticky;
            top: 24px;
            height: calc(100vh - 70px);
        }

        .code-container {
            position: relative;
            flex-grow: 1;
            background-color: #0b0c0d;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        code-header {
            background-color: #111214;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-family: monospace;
        }

        pre {
            margin: 0;
            padding: 16px;
            overflow: auto;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #f8f8f2;
            flex-grow: 1;
            white-space: pre;
        }

        .btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s;
            text-align: center;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #059669; }
        
        .collapsible-trigger {
            background: none;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            padding: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            width: 100%;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .collapsible-trigger:hover { color: #fff; border-color: var(--text-muted); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="workspace">
    
    <!-- ЛЕВАЯ ПАНЕЛЬ: НАСТРОЙКИ (КОНФИГУРАТОР) -->
    <div class="panel">
        <h2> DarkRP Job Configurator</h2>
        
        <!-- Базовая конфигурация -->
        <div class="section-group">
            <div class="section-title">Base Configuration</div>
            <div class="form-grid">
                <div class="field">
                    <label>TeamID (Lua Переменная) *</label>
                    <input type="text" id="teamId" value="TEAM_CITIZEN" oninput="updateCode()">
                </div>
                <div class="field">
                    <label>Название профессии *</label>
                    <input type="text" id="jobName" value="Гражданин" oninput="updateCode()">
                </div>
                <div class="field full-width">
                    <label>Категория (Category)</label>
                    <input type="text" id="category" value="Citizens" placeholder="Например: Citizens, Civil Protection" oninput="updateCode()">
                </div>
                <div class="field full-width">
                    <label>Пути к моделям (через запятую) *</label>
                    <input type="text" id="models" value="models/player/group01/male_04.mdl" placeholder="models/player/police.mdl, models/player/swat.mdl" oninput="updateCode()">
                </div>
            </div>
        </div>

        <!-- Параметры отображения и экономики -->
        <div class="section-group">
            <div class="section-title">Job & Economy Configuration</div>
            <div class="form-grid">
                <div class="field">
                    <label>Цвет профессии *</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="jobColor" value="#4f46e5" oninput="updateCode()">
                        <input type="text" id="colorText" value="#4f46e5" style="width: 80px;" readonly>
                    </div>
                </div>
                <div class="field">
                    <label>Команда смены профы *</label>
                    <input type="text" id="command" value="citizen" oninput="updateCode()">
                </div>
                <div class="field">
                    <label>Зарплата ($) *</label>
                    <input type="number" id="salary" value="45" oninput="updateCode()">
                </div>
                <div class="field">
                    <label>Лимит игроков (0 = макс) *</label>
                    <input type="number" id="maxPlayers" value="0" oninput="updateCode()">
                </div>
                <div class="field full-width">
                    <label>Оружие при спавне (через запятую)</label>
                    <input type="text" id="weapons" value="weapon_fists" placeholder="weapon_pistol, door_ram" oninput="updateCode()">
                </div>
                <div class="field full-width">
                    <label>Описание профессии *</label>
                    <textarea id="description" rows="3" oninput="updateCode()">Обычный житель города, пытающийся выжить.</textarea>
                </div>
            </div>
        </div>

        <!-- Права доступа и голосования -->
        <div class="section-group">
            <div class="section-title">Permissions & Triggers</div>
            <div class="form-grid">
                <div class="field">
                    <label>Базовый доступ (admin) *</label>
                    <select id="adminLevel" onchange="updateCode()">
                        <option value="0">Доступно всем (0)</option>
                        <option value="1">Только Администраторы (1)</option>
                        <option value="2">Только Супер-Администраторы (2)</option>
